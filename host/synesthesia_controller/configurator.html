<!doctype html>
<meta charset="utf-8">
<title>Synesthesia Hue Controller</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; }
  label { display:block; margin-top:1rem; } input { width:100%; box-sizing:border-box; padding:.5rem; }
  button { margin-top:1.2rem; padding:.6rem 1rem; } #status { margin-top:1rem; font-family:monospace; white-space:pre-wrap; }
</style>
<h1>Synesthesia Hue Controller</h1>
<label>Hue (raw 0.0–2.0)<input id="hue" type="range" min="0" max="2" step="0.001" value="0"></label>
<output id="value">0.000</output>
<button id="send">Send value</button>
<h2>Gesture configuration</h2>
<label>Deadband<input id="deadband" type="number" min="0" max="1" step="0.001" value="0.02"></label>
<label>Hold timeout (ms)<input id="hold" type="number" min="0" value="400"></label>
<label>Pull-away speed (mm/s)<input id="speed" type="number" min="1" value="800"></label>
<button id="save">Save configuration</button>
<h2>Shared Wi-Fi</h2>
<label>SSID<input id="wifiSsid" autocomplete="off"></label>
<label>Secret<input id="wifiSecret" type="password" autocomplete="new-password" placeholder="Leave blank to keep existing secret"></label>
<button id="saveWifi">Save Wi-Fi profile</button>
<h2>OSC destination</h2>
<label>Host<input id="oscHost" value="127.0.0.1"></label>
<label>Port<input id="oscPort" type="number" min="1" max="65535" value="6000"></label>
<label>Address<input id="oscAddress" value="/controls/meta/hue"></label>
<label>Device hostname<input id="deviceHost" value="huecontroller.local"></label>
<div id="status"></div>
<script>
const hue = document.querySelector('#hue'), value = document.querySelector('#value'), status = document.querySelector('#status');
const deadband = document.querySelector('#deadband'), hold = document.querySelector('#hold'), speed = document.querySelector('#speed');
const oscHost = document.querySelector('#oscHost'), oscPort = document.querySelector('#oscPort'), oscAddress = document.querySelector('#oscAddress'), deviceHost = document.querySelector('#deviceHost');
const wifiSsid = document.querySelector('#wifiSsid'), wifiSecret = document.querySelector('#wifiSecret');
hue.oninput = () => value.textContent = Number(hue.value).toFixed(3);
async function call(url, options) { const r = await fetch(url, options); const x = await r.json(); if (!r.ok) throw Error(x.error); return x; }
let liveTimer = null, liveBusy = false, liveQueued = false;
async function sendHue() {
  if (liveBusy) { liveQueued = true; return; }
  liveBusy = true;
  try {
    const x = await call('/api/hue', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({value:Number(hue.value), mode:'raw'})});
    status.textContent = `Live hue: ${Number(x.raw).toFixed(3)}  OSC normalized: ${Number(x.normalized).toFixed(3)}`;
  } catch(e) { status.textContent = e; }
  liveBusy = false;
  if (liveQueued) { liveQueued = false; scheduleHue(); }
}
function scheduleHue() {
  if (liveTimer === null) liveTimer = setTimeout(() => { liveTimer = null; sendHue(); }, 33);
}
hue.oninput = () => { value.textContent = Number(hue.value).toFixed(3); scheduleHue(); };
document.querySelector('#send').onclick = sendHue;
async function loadConfig() { const x = await call('/api/config'); deadband.value = x.deadband; hold.value = x.hold_timeout_ms; speed.value = x.pullaway_speed_mm_s; oscHost.value = x.osc_host; oscPort.value = x.osc_port; oscAddress.value = x.osc_address; deviceHost.value = x.device_host || ''; }
document.querySelector('#save').onclick = async () => { try { const x = await call('/api/config', {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify({deadband:Number(deadband.value), hold_timeout_ms:Number(hold.value), pullaway_speed_mm_s:Number(speed.value), osc_host:oscHost.value, osc_port:Number(oscPort.value), osc_address:oscAddress.value, device_host:deviceHost.value})}); status.textContent = JSON.stringify(x, null, 2); } catch(e) { status.textContent = e; } };
async function loadWifi() { const x = await call('/api/wifi'); wifiSsid.value = x.ssid; wifiSecret.value = ''; }
document.querySelector('#saveWifi').onclick = async () => { try { const body = {ssid:wifiSsid.value}; if (wifiSecret.value) body.secret = wifiSecret.value; const x = await call('/api/wifi', {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify(body)}); wifiSecret.value = ''; status.textContent = `Saved shared Wi-Fi: ${x.ssid} (secret set: ${x.secret_set})`; } catch(e) { status.textContent = e; } };
loadWifi().catch(e => status.textContent = e);
loadConfig().catch(e => status.textContent = e);
</script>
