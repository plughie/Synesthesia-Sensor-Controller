name: Host tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install -r host/synesthesia_controller/requirements.txt
      - run: python -m unittest discover -s host/synesthesia_controller -p 'test_*.py' -v

